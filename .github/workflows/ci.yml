name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: OpenWrt ${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both package managers are supported, and they are not
        # interchangeable: 24.10 uses opkg, 25.12 uses apk.
        release: [ "24.10.6", "25.12.0" ]

    steps:
      - uses: actions/checkout@v4

      - name: Build a rootfs image from the official tarball
        run: |
          set -eu
          url="https://downloads.openwrt.org/releases/${{ matrix.release }}/targets/x86/64/openwrt-${{ matrix.release }}-x86-64-rootfs.tar.gz"
          curl -fsSL "$url" | docker import --change 'CMD ["/bin/sh"]' - "openwrt-rootfs:${{ matrix.release }}"

      - name: Install the ucode socket module
        run: |
          set -eu
          docker run --rm openwrt-rootfs:${{ matrix.release }} sh -eu -c '
            mkdir -p /var/lock
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache ucode-mod-socket >/dev/null
            else
              opkg update >/dev/null 2>&1
              opkg install ucode-mod-socket >/dev/null
            fi
            ucode -e "require(\"socket\");"
          '

      - name: Unit tests
        run: |
          docker run --rm -v "$PWD":/work -w /work \
            openwrt-rootfs:${{ matrix.release }} ucode -L src tests/unit.uc

      - name: Stop/lock integration tests
        run: |
          docker run --rm -v "$PWD":/work -w /work \
            openwrt-rootfs:${{ matrix.release }} sh tests/stop.sh

      - name: Shell syntax
        run: |
          for script in install.sh scripts/*.sh tests/stop.sh; do
            sh -n "$script"
          done

  build:
    name: Build packages
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      # build.sh packs the ipk with a small Python helper, so it runs on the
      # runner (which has python3) rather than inside a rootfs image, where
      # python3 is absent.
      - name: Build ipk
        run: sh scripts/build.sh

      - name: Build apk
        run: |
          docker run --rm -v "$PWD":/work -w /work -e APK_TOOL=apk \
            alpine:edge sh scripts/build-apk.sh

      - name: Build a 25.12 rootfs image from the official tarball
        run: |
          set -eu
          url="https://downloads.openwrt.org/releases/25.12.0/targets/x86/64/openwrt-25.12.0-x86-64-rootfs.tar.gz"
          curl -fsSL "$url" | docker import --change 'CMD ["/bin/sh"]' - openwrt-rootfs:25.12.0

      # The ipk is a gzipped tar holding debian-binary, data.tar.gz and
      # control.tar.gz.
      - name: Check the ipk contents
        run: |
          set -eu
          version=$(cat VERSION)
          ipk="dist/subbridge_${version}-r1_all.ipk"
          test -f "$ipk"

          work=$(mktemp -d)
          # The member names carry a leading "./"; GNU tar matches them
          # literally, while bsdtar is lenient. Spelling them out keeps this
          # step working on both.
          tar xzf "$ipk" -C "$work" ./data.tar.gz ./control.tar.gz
          tar tzf "$work/data.tar.gz" | grep -q 'usr/lib/subbridge/net.uc'
          tar tzf "$work/data.tar.gz" | grep -q 'usr/share/subbridge/version'
          tar xzf "$work/data.tar.gz" -C "$work" ./usr/share/subbridge/version
          test "$(cat "$work/usr/share/subbridge/version")" = "$version"
          tar xzOf "$work/control.tar.gz" ./control | grep -q "^Version: ${version}-r1$"

      # Installing is a stronger check than listing files: it proves the
      # metadata, the post-install script and the version file agree.
      - name: Install the apk into OpenWrt 25.12
        run: |
          set -eu
          version=$(cat VERSION)
          docker run --rm -v "$PWD/dist":/d:ro openwrt-rootfs:25.12.0 sh -eu -c "
            apk update >/dev/null 2>&1
            apk add --allow-untrusted --force-non-repository /d/subbridge_${version}-r1_all.apk >/dev/null
            test \"\$(cat /usr/share/subbridge/version)\" = '$version'
            /usr/bin/subbridge version | grep -q '$version'
            test -f /usr/lib/subbridge/net.uc
            test -f /usr/share/rpcd/ucode/subbridge
          "

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.ipk
            dist/*.apk
